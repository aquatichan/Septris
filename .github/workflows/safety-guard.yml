name: Safety guard unit test

on:
  pull_request:
    paths:
      - "src/familiarity.py"
      - "tests/test_familiarity.py"
      - ".github/workflows/safety-guard.yml"
  workflow_dispatch:

jobs:
  familiarity-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal test dependencies
        run: python -m pip install --upgrade pip numpy pandas pytest
      - name: Run guard tests
        run: python -m pytest -q tests/test_familiarity.py
